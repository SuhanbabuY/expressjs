<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>
    <style>
        body {
            background-color: lightblue;
        }
          form {
            background-color: rgb(46, 157, 205);
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
        }
    </style>
</head>

<body>
    
   
    <form action="/student/15?_method=DELETE" method="POST">
        <h1>Delete Student Page</h1>

        <label for="id"> ID:</label>
        <input type="text" disabled><br><br>

       
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname"><br><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname"><br><br>

        
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="nic">National Identity Card:</label>
        <input type="text" id="nic" name="nic"><br><br>

        <input type="button" value="Delete">
        <input type="button" value="Cancel">
        
    </form>
</body>

</html>
